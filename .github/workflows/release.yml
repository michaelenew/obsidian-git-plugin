# Builds the plugin and publishes a GitHub release that BRAT (and Obsidian)
# can install from. Run it from the Actions tab, or push a tag like 0.1.0.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(node -p "require('./manifest.json').version")
          if gh release view "$version" >/dev/null 2>&1; then
            gh release upload "$version" main.js manifest.json styles.css --clobber
          else
            gh release create "$version" main.js manifest.json styles.css --title "$version" --notes "Simple Git Sync $version" --target "$GITHUB_SHA"
          fi
